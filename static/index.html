<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skylog · Night Sky Observation Logger</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%23000'/><path d='M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z' fill='%23f5c86a'/></svg>">
  <link rel="preload" href="fonts/lato-latin-400.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="app.css">
</head>
<body>
<div class="app">
  <!-- ===================== top bar ===================== -->
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" class="logo"><circle cx="16" cy="16" r="15" fill="url(#lg)"/><path d="M16 6l2.4 7.6L26 16l-7.6 2.4L16 26l-2.4-7.6L6 16l7.6-2.4z" fill="#f5c86a"/><defs><radialGradient id="lg"><stop offset="0" stop-color="#1c1c1c"/><stop offset="1" stop-color="#000"/></radialGradient></defs></svg>
      <div>
        <div class="brand-name">Skylog</div>
        <div class="brand-sub">Night sky observation logger</div>
      </div>
    </div>
    <div class="chips" id="chips"></div>
    <div class="offline-pill" title="Everything runs locally"><span class="dot"></span>Offline</div>
  </header>

  <!-- ===================== left: inputs ===================== -->
  <aside class="panel left">
    <section class="card">
      <h3><svg viewBox="0 0 24 24"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.5"/></svg>Location</h3>
      <label class="field">
        <span>Coordinates</span>
        <div class="coord-wrap">
          <input id="coords" placeholder="51.5074, -0.1278  or  51°30′N 0°07′W" autocomplete="off" spellcheck="false">
          <button class="icon-btn sm" id="coordsGo" title="Apply coordinates (Enter)"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
        </div>
        <small class="hint" id="coordHint">Decimal, DMS, or paste a map link</small>
      </label>
      <label class="field">
        <span>Place name</span>
        <input id="place" list="cities" placeholder="Search a city, a saved place, or name this spot" autocomplete="off">
        <datalist id="cities"></datalist>
      </label>
      <div class="saved-head">
        <span>Saved places</span>
        <button class="btn ghost sm" id="savePlace"><svg viewBox="0 0 24 24"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1L3.2 9.5l6.1-.9z"/></svg>Save this place</button>
      </div>
      <div class="save-form" id="saveForm">
        <input id="saveName" placeholder="Name, e.g. Backyard" maxlength="80">
        <button class="btn primary sm" id="saveConfirm">Save</button>
        <button class="btn ghost sm" id="saveCancel">✕</button>
      </div>
      <div class="places" id="places"></div>
      <button class="btn ghost full" id="geo"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="7"/></svg>Use device location</button>
    </section>

    <section class="card">
      <h3><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Date &amp; time</h3>
      <div class="row2">
        <label class="field"><span>Night of</span><input id="date" type="date"></label>
        <label class="field"><span>UTC offset (h)</span><input id="tz" type="number" step="0.25" min="-12" max="14"></label>
      </div>
      <div class="time-head">
        <div class="big-time" id="timeLabel">21:00</div>
        <div class="time-btns">
          <button class="icon-btn" id="play" title="Animate time"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
          <button class="btn ghost sm" id="now">Now</button>
        </div>
      </div>
      <input type="range" id="minutes" min="0" max="1435" step="5" class="range time-range">
      <div class="scale"><span>12:00</span><span>18:00</span><span>00:00</span><span>06:00</span><span>12:00</span></div>
    </section>

    <section class="card">
      <h3><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light pollution</h3>
      <div class="bortle-head">
        <div><span class="bortle-num" id="bortleNum">4</span><span class="muted"> / 9 Bortle</span></div>
        <div class="muted small" id="bortleNelm"></div>
      </div>
      <input type="range" id="bortle" min="1" max="9" step="1" class="range bortle-range">
      <div class="bortle-label" id="bortleLabel"></div>
    </section>

    <section class="card">
      <h3><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>Layers</h3>
      <div id="layers"></div>
      <div class="divider"></div>
      <label class="toggle-row accent">
        <span><b>Mark logged objects</b><small>Gold rings &amp; lines on the map (your log is unaffected)</small></span>
        <input type="checkbox" id="showLogged" checked><i class="switch"></i>
      </label>
      <label class="toggle-row accent" style="margin-top:10px">
        <span><b>Highlight logged only</b><small>Dim everything you haven't logged</small></span>
        <input type="checkbox" id="hlLogged"><i class="switch"></i>
      </label>
    </section>
  </aside>

  <!-- ===================== center: sky ===================== -->
  <main class="sky-wrap" id="skyWrap">
    <canvas id="sky"></canvas>
    <div class="sky-overlay top-left" id="skyInfo"></div>
    <div class="sky-overlay bottom-left legend">
      <span><i class="lg-dot vis"></i>Visible</span>
      <span><i class="lg-dot faint"></i>Below limit</span>
      <span><i class="lg-dot dso"></i>Deep-sky</span>
      <span><i class="lg-dot logged"></i>Logged</span>
    </div>
    <div class="sky-overlay bottom-right zoom">
      <button class="icon-btn" id="zoomIn" title="Zoom in">+</button>
      <button class="icon-btn" id="zoomOut" title="Zoom out">−</button>
      <button class="icon-btn" id="snapBtn" title="Download an image of what you saw"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button class="icon-btn" id="zoomReset" title="Reset view"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.3-5.7"/><path d="M4 4v4h4"/></svg></button>
    </div>
    <div class="tooltip" id="tooltip"></div>
    <div class="popover" id="popover"></div>
    <div class="loading" id="loading"></div>
  </main>

  <!-- ===================== right: lists & log ===================== -->
  <aside class="panel right">
    <nav class="tabs">
      <button class="tab active" data-tab="visible">Visible</button>
      <button class="tab" data-tab="log">Log <span class="badge" id="logCount">0</span></button>
      <button class="tab" data-tab="stats">Stats</button>
      <button class="tab" data-tab="checklist">Checklist</button>
      <button class="tab" data-tab="history">History</button>
    </nav>

    <div class="tab-body active" id="tab-visible">
      <div class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="search" placeholder="Search stars, planets, nebulae, clusters…"></div>
      <div class="seg" id="filterSeg">
        <button data-f="good" class="active">Visible</button>
        <button data-f="all">Above horizon</button>
        <button data-f="stars">Bright stars</button>
      </div>
      <div class="list" id="visList"></div>
    </div>

    <div class="tab-body" id="tab-log">
      <div class="session-head">
        <div>
          <div class="session-title" id="sessTitle">—</div>
          <div class="muted small" id="sessSub"></div>
        </div>
        <span class="save-state" id="saveState"></span>
      </div>
      <div class="ratings">
        <div><span class="muted small">Seeing</span><div class="stars-rate" data-key="seeing"></div></div>
        <div><span class="muted small">Transparency</span><div class="stars-rate" data-key="transparency"></div></div>
      </div>
      <div class="window-row">
        <span class="muted small">Observed</span>
        <input type="time" id="winStart" title="Start of observing (blank = first logged item)">
        <span class="muted small">to</span>
        <input type="time" id="winEnd" title="End of observing (blank = last logged item)">
        <button class="btn ghost sm" id="winClear" title="Use first/last logged times">Auto</button>
      </div>
      <textarea id="sessNotes" placeholder="Session notes — conditions, equipment, highlights…"></textarea>
      <div class="list" id="logList"></div>
      <div class="log-actions">
        <button class="btn primary" id="saveBtn"><svg viewBox="0 0 24 24"><path d="M5 3h11l5 5v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z"/><path d="M7 3v6h8V3M7 21v-7h10v7"/></svg>Save to file</button>
        <div class="export">
          <button class="btn ghost" id="exportBtn">Export ▾</button>
          <div class="menu" id="exportMenu">
            <button data-fmt="json">JSON</button><button data-fmt="csv">CSV</button><button data-fmt="md">Markdown</button><button data-fmt="png">Sky image (JPG)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="tab-body" id="tab-stats">
      <div class="stats" id="statsBody"><div class="empty"><div class="big">📊</div>Log some observations to see stats.</div></div>
    </div>

    <div class="tab-body" id="tab-checklist">
      <div class="ck-head">
        <div class="ck-progress"><div class="v" id="ckCount">0<small> / 0 seen</small></div><div class="ck-sub" id="ckUp"></div></div>
        <div class="bar"><i id="ckBar" style="width:0%;background:var(--good)"></i></div>
        <div class="seg sm" id="ckKind"><button data-v="all" class="active">All</button><button data-v="planet">Solar system</button><button data-v="star">Stars</button><button data-v="dso">Deep sky</button></div>
        <div class="seg sm" id="ckStatus"><button data-v="all" class="active">All</button><button data-v="todo">To find</button><button data-v="seen">Seen</button><button data-v="up">Up now</button></div>
      </div>
      <div class="list" id="ckList"></div>
    </div>

    <div class="tab-body" id="tab-history">
      <div class="list" id="histList"></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script src="cities.js"></script>
<script src="app.js"></script>
</body>
</html>
